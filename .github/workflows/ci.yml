name: CI

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  YX_NPM_PACKAGE: "@aldenwangexis/yx-cli"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test npm wrapper
        working-directory: npm/yx-cli
        run: |
          npm test
          npm pack --dry-run

      - name: Check release version alignment
        if: startsWith(github.ref, 'refs/tags/v')
        run: sh scripts/check_release_version.sh "${{ github.ref_name }}"

  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
            output: yx-darwin-arm64
          - name: linux-amd64
            goos: linux
            goarch: amd64
            output: yx-linux-amd64
          - name: linux-arm64
            goos: linux
            goarch: arm64
            output: yx-linux-arm64
          - name: windows-amd64
            goos: windows
            goarch: amd64
            output: yx-windows-amd64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.3"
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -trimpath \
            -ldflags "-X github.com/AldenWangExis/yx-cli/internal/cli.Version=${VERSION} -X github.com/AldenWangExis/yx-cli/internal/cli.Commit=${COMMIT} -X github.com/AldenWangExis/yx-cli/internal/cli.Date=${DATE}" \
            -o "dist/${{ matrix.output }}" ./cmd/yx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yx-${{ matrix.name }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GH_REPO"
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes "Release $TAG" --repo "$GH_REPO"
          fi

  publish-npm:
    name: Publish npm
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && vars.YX_ENABLE_NPM_PUBLISH == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Check release version alignment
        run: sh scripts/check_release_version.sh "${{ github.ref_name }}"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Prepare npm platform packages
        run: node npm/yx-cli/scripts/prepare-platform-packages.js dist

      - name: Verify npm platform package contents
        run: |
          for dir in npm/yx-cli-darwin-arm64 npm/yx-cli-linux-x64 npm/yx-cli-linux-arm64 npm/yx-cli-win32-x64; do
            npm pack --dry-run "./$dir"
          done

      - name: Publish npm platform packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in npm/yx-cli-darwin-arm64 npm/yx-cli-linux-x64 npm/yx-cli-linux-arm64 npm/yx-cli-win32-x64; do
            npm publish --access public "./$dir"
          done

      - name: Publish npm main package
        working-directory: npm/yx-cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
